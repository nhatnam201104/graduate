<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
<marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ecff"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5cc8ff"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a5a"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77dff"/></marker>

</defs>
<rect width="1200" height="675" fill="#070a16"/>
<text x="40" y="52" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="28" fill="#e8ecff" font-weight="bold" text-anchor="start" opacity="1">Vô Hạ Hạn (無下限呪術 · Limitless) — bản đồ chiêu thức</text>
<text x="40" y="82" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="15" fill="#9aa4d4" font-weight="normal" text-anchor="start" opacity="1">Thuật thức di truyền của gia tộc Gojo: đưa khái niệm “vô hạn” vào thực tại, thao túng không gian</text>
<rect x="470" y="110" width="260" height="70" rx="14" fill="#7fd3ff22" stroke="#7fd3ff" stroke-width="2"/><text x="600.0" y="140" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" opacity="1">Lục Nhãn (六眼)</text><text x="600.0" y="164" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">Điều khiển chú lực tới mức nguyên tử</text>
<text x="600" y="200" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="12" fill="#7fd3ff" font-weight="normal" text-anchor="middle" opacity="1">điều kiện để làm chủ hoàn toàn ↓</text>
<rect x="430" y="210" width="340" height="70" rx="14" fill="#ffffff22" stroke="#ffffff" stroke-width="2"/><text x="600.0" y="240" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" opacity="1">VÔ HẠ HẠN (Mukagen)</text><text x="600.0" y="264" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">Thao túng không gian bằng chuỗi hội tụ / phân kỳ</text>
<path d="M600,280 C600,310 165,310 165,340" stroke="#ffffff55" fill="none" stroke-width="2" marker-end="url(#arrW)"/>
<rect x="40" y="340" width="250" height="90" rx="14" fill="#cfd8ff22" stroke="#cfd8ff" stroke-width="2"/><text x="165.0" y="370" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" opacity="1">Vô Hạn (無限)</text><text x="165.0" y="394" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">Trung tính · DỪNG</text><text x="165.0" y="414" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">rào chắn vô hình</text>
<path d="M600,280 C600,310 455,310 455,340" stroke="#ffffff55" fill="none" stroke-width="2" marker-end="url(#arrW)"/>
<rect x="330" y="340" width="250" height="90" rx="14" fill="#2fa8ff22" stroke="#2fa8ff" stroke-width="2"/><text x="455.0" y="370" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" opacity="1">Thương (蒼) · Blue</text><text x="455.0" y="394" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">Hội tụ → HÚT</text><text x="455.0" y="414" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">chú lực khuếch đại</text>
<path d="M600,280 C600,310 745,310 745,340" stroke="#ffffff55" fill="none" stroke-width="2" marker-end="url(#arrW)"/>
<rect x="620" y="340" width="250" height="90" rx="14" fill="#ff3b4e22" stroke="#ff3b4e" stroke-width="2"/><text x="745.0" y="370" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" opacity="1">Hách (赫) · Red</text><text x="745.0" y="394" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">Phân kỳ → ĐẨY</text><text x="745.0" y="414" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">năng lượng dương</text>
<path d="M600,280 C600,310 1035,310 1035,340" stroke="#ffffff55" fill="none" stroke-width="2" marker-end="url(#arrW)"/>
<rect x="910" y="340" width="250" height="90" rx="14" fill="#e6e6ff22" stroke="#e6e6ff" stroke-width="2"/><text x="1035.0" y="370" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" opacity="1">Vô Lượng Không Xứ</text><text x="1035.0" y="394" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">無量空処 · Lãnh địa</text><text x="1035.0" y="414" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">nhốt trong vô hạn</text>
<path d="M455,430 C455,470 520,490 540,500" stroke="#2fa8ff" fill="none" stroke-width="3" marker-end="url(#arrB)"/>
<path d="M745,430 C745,470 680,490 660,500" stroke="#ff3b4e" fill="none" stroke-width="3" marker-end="url(#arrR)"/>
<rect x="430" y="500" width="340" height="90" rx="14" fill="#b44cff22" stroke="#b44cff" stroke-width="2"/><text x="600.0" y="530" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" opacity="1">Hư Thức “Tử” (虚式「茈」)</text><text x="600.0" y="554" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">Hollow Purple · Va chạm hội tụ × phân kỳ</text><text x="600.0" y="574" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#cfd6ff" font-weight="normal" text-anchor="middle" opacity="1">→ “khối lượng ảo” lao đi, xoá sạch vật chất</text>
<text x="40" y="520" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#9aa4d4" font-weight="normal" text-anchor="start" opacity="1">• Xanh ≈ blueshift (không gian bị nén)</text>
<text x="40" y="542" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#9aa4d4" font-weight="normal" text-anchor="start" opacity="1">• Đỏ ≈ redshift (không gian giãn ra)</text>
<text x="40" y="564" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#9aa4d4" font-weight="normal" text-anchor="start" opacity="1">• Tím = Xanh + Đỏ</text>
<text x="830" y="520" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#9aa4d4" font-weight="normal" text-anchor="start" opacity="1">• Purple &amp; Lãnh địa cần Lục Nhãn</text>
<text x="830" y="542" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#9aa4d4" font-weight="normal" text-anchor="start" opacity="1">• không bị che (bỏ băng bịt mắt)</text>
<text x="40" y="657" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="12" fill="#6f78a8" font-weight="normal" text-anchor="start" opacity="1">Nguồn: Jujutsu Kaisen Wiki (Limitless, Six Eyes) — Ch.75 / Ep.28, Vol.2 p.188. Hình minh hoạ tự vẽ bởi MSW Agent.</text>
</svg>