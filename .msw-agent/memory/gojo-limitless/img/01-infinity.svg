<text x="1060" y="480" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="12" fill="#9aa4d4" font-weight="normal" text-anchor="middle" opacity="1">→ 0</text>
<text x="1060" y="500" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="11" fill="#7a83ad" font-weight="normal" text-anchor="middle" opacity="1">(chia vô hạn lần)</text>
<text x="850" y="320" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="15" fill="#ffd7a0" font-weight="normal" text-anchor="middle" opacity="1">vận tốc v → 0 khi càng gần</text>
<text x="850" y="342" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#ffd7a0" font-weight="normal" text-anchor="middle" opacity="1">(đòn đánh khựng lại lơ lửng cách Gojo vài cm)</text>
<text x="850" y="150" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="16" fill="#e8ecff" font-weight="normal" text-anchor="middle" opacity="1">Σ d/2ⁿ  hội tụ — giống nghịch lý Zeno (Achilles &amp; con rùa)</text>
<text x="470" y="520" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">• Không có màu, không phát sáng — chỉ nhận ra qua vật thể bị chậm/dừng (lửa Jogo, tay Yuji).</text>
<text x="470" y="546" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">• Có thể mở rộng thành mái vòm để chặn dung nham/khí độc, hoặc tăng sản lượng để đè ép đối thủ.</text>
<text x="470" y="572" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">• Chỉ bị vô hiệu bởi chính Gojo, hoặc bởi lãnh địa (bành trướng / khuếch đại lãnh địa).</text>
<text x="40" y="520" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="15" fill="#7fd3ff" font-weight="bold" text-anchor="start" opacity="1">Ghi nhớ VFX:</text>
<text x="40" y="546" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#7fd3ff" font-weight="normal" text-anchor="start" opacity="1">KHÔNG vẽ khiên phát sáng.</text>
<text x="40" y="570" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#7fd3ff" font-weight="normal" text-anchor="start" opacity="1">Chỉ khựng chuyển động + méo nhẹ.</text>
<text x="40" y="657" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="12" fill="#6f78a8" font-weight="normal" text-anchor="start" opacity="1">Nguồn: JJK Wiki “Limitless” — Ch.14 pp.8-10 / Ep.7 (Jogo), Ch.13 p.18, Ch.85 p.15, Ch.84 p.13. Minh hoạ tự vẽ.</text>
