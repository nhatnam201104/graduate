<text x="40" y="52" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="28" fill="#e8ecff" font-weight="bold" text-anchor="start" opacity="1">Vô Hạn (無限 · Infinity) — trạng thái trung tính</text>
<text x="40" y="82" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="15" fill="#9aa4d4" font-weight="normal" text-anchor="start" opacity="1">“Sức mạnh để dừng lại”: khoảng cách hữu hạn bị chia vô hạn lần, mọi thứ tiến tới đều chậm dần và không bao giờ chạm</text>
