<text x="40" y="140" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">Hiện ra là một quả cầu đỏ NHỎ, rực sáng;</text>
<text x="40" y="164" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">  bắn ra khỏi người rồi nổ tung khi va chạm.</text>
<text x="40" y="188" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">Sản lượng chú lực ít nhất GẤP ĐÔI Thương.</text>
<text x="40" y="212" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">Cần thuật thức đảo ngược → Gojo chỉ dùng</text>
<text x="40" y="236" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">  được sau khi suýt chết dưới tay Toji.</text>
<text x="40" y="260" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">Điều khiển được thời điểm nổ: Hách lượn</text>
<text x="40" y="284" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">  vòng qua toà nhà, đánh sau lưng Sukuna.</text>
<text x="40" y="308" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">Bản thường: dùng tuỳ ý (Bách Quỷ Dạ Hành,</text>
<text x="40" y="332" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">  vs Jogo); niệm chú để tăng sản lượng.</text>
<text x="40" y="380" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#ff8a8a" font-weight="bold" text-anchor="start" opacity="1">Chú ngữ:</text>
<text x="40" y="404" font-family="Noto Sans CJK JP, Noto Sans JP, IPAGothic, DejaVu Sans, sans-serif" font-size="16" fill="#e8ecff" font-weight="normal" text-anchor="start" opacity="1">「位相」「波羅蜜」「光の柱」</text>
