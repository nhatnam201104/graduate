<text x="40" y="82" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="15" fill="#9aa4d4" font-weight="normal" text-anchor="start" opacity="1">Va chạm Thương (hội tụ) × Hách (phân kỳ) → sinh “khối lượng ảo” bị đẩy về phía mục tiêu, xoá sạch mọi thứ trên đường đi</text>
