<text x="1030.0" y="380" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#e8ecff" font-weight="bold" text-anchor="middle" opacity="1">④ Rãnh xoá trơn, không cháy</text>
<text x="40" y="450" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="15" fill="#d6a8ff" font-weight="bold" text-anchor="start" opacity="1">Biến thể:</text>
<text x="40" y="476" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">• Thường (lược ấn &amp; chú): quét sạch rừng (vs Hanami, Ep.20), xuyên người Toji (Ep.28).</text>
<text x="40" y="500" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">• 200%: đủ ấn tay + chú ngữ, Utahime khuếch đại → bắn từ Shibuya tới Shinjuku (vs Sukuna, Ch.223).</text>
<text x="40" y="524" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="14" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">• Không giới hạn / nổ toàn hướng: bắn Hách vào quả Thương còn sót → nổ khắp Shinjuku (Ch.235).</text>
<text x="830" y="450" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="15" fill="#d6a8ff" font-weight="bold" text-anchor="start" opacity="1">Ấn tay:</text>
<text x="830" y="476" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">Ngón trỏ + út duỗi → chụm</text>
<text x="830" y="496" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">cái + trỏ, giữa duỗi → bung</text>
<text x="830" y="516" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#d6dcff" font-weight="normal" text-anchor="start" opacity="1">ngón tay như vụ nổ.</text>
<text x="40" y="572" font-family="Noto Sans CJK JP, Noto Sans JP, IPAGothic, DejaVu Sans, sans-serif" font-size="15" fill="#e8ecff" font-weight="normal" text-anchor="start" opacity="1">Chú ngữ: 「九綱」「偏光」「烏と声明」「表裏の間」</text>
<text x="40" y="596" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="13" fill="#9aa4d4" font-weight="normal" text-anchor="start" opacity="1">Chín sợi dây · Ánh sáng phân cực · Quạ và thanh minh · Khoảng giữa trước và sau</text>
<text x="40" y="657" font-family="DejaVu Sans, Noto Sans, Segoe UI, sans-serif" font-size="12" fill="#6f78a8" font-weight="normal" text-anchor="start" opacity="1">Nguồn: JJK Wiki “Hollow Technique: Purple” — Fanbook p.158, Ch.52 / Ep.20, Ch.75 / Ep.28, Ch.223, Ch.235. Minh hoạ tự vẽ.</text>
